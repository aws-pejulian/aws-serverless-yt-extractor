name: Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require repository variables
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
          ROOT_DOMAIN: ${{ vars.ROOT_DOMAIN }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          FROM_EMAIL: ${{ vars.FROM_EMAIL }}
          GEO_COUNTRY_CODE: ${{ vars.GEO_COUNTRY_CODE }}
          APP_REGION: ${{ vars.APP_REGION }}
          CERTIFICATE_REGION: ${{ vars.CERTIFICATE_REGION }}
        run: |
          missing=0
          for name in AWS_DEPLOY_ROLE_ARN HOSTED_ZONE_ID ROOT_DOMAIN SITE_DOMAIN FROM_EMAIL GEO_COUNTRY_CODE APP_REGION CERTIFICATE_REGION; do
            if [ -z "${!name}" ]; then
              echo "Set the GitHub variable $name"
              missing=1
            fi
          done
          exit "$missing"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.APP_REGION }}
          role-session-name: github-actions-deploy

      - name: Deploy
        env:
          HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
          ROOT_DOMAIN: ${{ vars.ROOT_DOMAIN }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          FROM_EMAIL: ${{ vars.FROM_EMAIL }}
          GEO_COUNTRY_CODE: ${{ vars.GEO_COUNTRY_CODE }}
          APP_REGION: ${{ vars.APP_REGION }}
          CERTIFICATE_REGION: ${{ vars.CERTIFICATE_REGION }}
        run: pnpm run deploy --all --require-approval never

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require repository variables
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
          ROOT_DOMAIN: ${{ vars.ROOT_DOMAIN }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          FROM_EMAIL: ${{ vars.FROM_EMAIL }}
          GEO_COUNTRY_CODE: ${{ vars.GEO_COUNTRY_CODE }}
          APP_REGION: ${{ vars.APP_REGION }}
          CERTIFICATE_REGION: ${{ vars.CERTIFICATE_REGION }}
          QUEUED_MESSAGE: ${{ vars.QUEUED_MESSAGE }}
        run: |
          missing=0
          for name in AWS_DEPLOY_ROLE_ARN HOSTED_ZONE_ID ROOT_DOMAIN SITE_DOMAIN FROM_EMAIL GEO_COUNTRY_CODE APP_REGION CERTIFICATE_REGION QUEUED_MESSAGE; do
            if [ -z "${!name}" ]; then
              echo "Set the GitHub variable $name"
              missing=1
            fi
          done
          exit "$missing"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.APP_REGION }}
          role-session-name: github-actions-deploy

      - name: Write site configuration
        env:
          HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
          ROOT_DOMAIN: ${{ vars.ROOT_DOMAIN }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          FROM_EMAIL: ${{ vars.FROM_EMAIL }}
          GEO_COUNTRY_CODE: ${{ vars.GEO_COUNTRY_CODE }}
          APP_REGION: ${{ vars.APP_REGION }}
          CERTIFICATE_REGION: ${{ vars.CERTIFICATE_REGION }}
          QUEUED_MESSAGE: ${{ vars.QUEUED_MESSAGE }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BRANCH: ${{ github.ref_name }}
          GITHUB_OIDC_PROVIDER_ARN: ${{ vars.GITHUB_OIDC_PROVIDER_ARN }}
        run: |
          umask 077
          cat > .env << EOF
          HOSTED_ZONE_ID=${HOSTED_ZONE_ID}
          ROOT_DOMAIN=${ROOT_DOMAIN}
          SITE_DOMAIN=${SITE_DOMAIN}
          FROM_EMAIL=${FROM_EMAIL}
          GEO_COUNTRY_CODE=${GEO_COUNTRY_CODE}
          APP_REGION=${APP_REGION}
          CERTIFICATE_REGION=${CERTIFICATE_REGION}
          QUEUED_MESSAGE='${QUEUED_MESSAGE}'
          GITHUB_REPOSITORY=${GITHUB_REPOSITORY}
          GITHUB_BRANCH=${GITHUB_BRANCH}
          EOF
          if [ -n "$GITHUB_OIDC_PROVIDER_ARN" ]; then
            printf 'GITHUB_OIDC_PROVIDER_ARN=%s\n' "$GITHUB_OIDC_PROVIDER_ARN" >> .env
          fi

      - name: Deploy
        run: pnpm deploy -- --all --require-approval never
